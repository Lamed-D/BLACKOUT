
services:
  # 1. Flask + Gunicorn
  flask-app:
    profiles: [board]
    build: .
    container_name: blackout_flask
    expose:
      - "5000"
    environment:
      FLASK_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: blackout_db
      DB_USER: blackout_user
      DB_PASSWORD: ${DB_PASSWORD:-blackout_pass}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}

      OAUTHLIB_INSECURE_TRANSPORT: "1"
      OAUTHLIB_RELAX_TOKEN_SCOPE: "1"

    volumes:
      - uploads:/blackout_lab/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - blackout_net
    restart: unless-stopped

  # 2. Apache Reverse Proxy
  apache-server:
    profiles: [board]
    image: httpd:2.4
    container_name: blackout_apache
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - ./my-site.conf:/usr/local/apache2/conf/extra/my-site.conf:ro
      - ./httpd-proxy.conf:/usr/local/apache2/conf/httpd-proxy.conf:ro
    command: >
      sh -ec "sed 's/^Listen 80$/Listen 8080/'
      /usr/local/apache2/conf/httpd.conf > /tmp/blackout-httpd.conf &&
      exec httpd-foreground -f /tmp/blackout-httpd.conf
      -c 'Include /usr/local/apache2/conf/httpd-proxy.conf'"
    depends_on:
      - flask-app
    networks:
      - blackout_net
    restart: unless-stopped

  # 3. MariaDB
  mariadb:
    profiles: [board]
    image: mariadb:10.11
    container_name: blackout_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: blackout_db
      MYSQL_USER: blackout_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-blackout_pass}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackout_net
    restart: unless-stopped

  portal:
    image: nginx:stable-alpine
    volumes:
      - ./portal/index.html:/usr/share/nginx/html/index.html:ro
      - ./static/guide.html:/usr/share/nginx/html/guide.html:ro
      - ./static/style.css:/usr/share/nginx/html/static/style.css:ro
    ports:
      - "127.0.0.1:8088:80"
    networks: [public_net]
    restart: unless-stopped

  # 4. Cloudflare Quick Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: blackout_cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://portal:80
    depends_on:
      - portal
    networks:
      - public_net
    restart: unless-stopped

volumes:
  uploads:
  mariadb_data:

networks:
  public_net:
  blackout_net:
    driver: bridge
