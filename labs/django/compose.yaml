name: blackout_django
# 로컬 전용. cloudflared/터널 없음(추후 사용자가 직접 추가).
services:
  web:
    build:
      context: ..
      dockerfile: django/Dockerfile
    ports:
      - "127.0.0.1:8103:8000"
    environment:
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-django-lab}
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-django-lab}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "community", "-d", "community"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
