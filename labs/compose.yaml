name: blackout_labs
# 로컬 전용 통합 기동. cloudflared/터널 없음(추후 사용자가 직접 추가).
# 엔진이 추가되면 services 에 node(:8102)/django(:8103) 와 각 DB 를 더한다.
services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    environment:
      DB_HOST: php-db
      DB_NAME: blackout
      DB_USER: blackout
      DB_PASSWORD: blackout_pass
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://127.0.0.1:8101}
    depends_on:
      php-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8101:80"
    restart: unless-stopped

  php-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: blackout
      MARIADB_USER: blackout
      MARIADB_PASSWORD: blackout_pass
      MARIADB_ROOT_PASSWORD: root_pass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: node/Dockerfile
    environment:
      DB_HOST: node-db
      DB_NAME: blackout
      DB_USER: blackout
      DB_PASSWORD: blackout_pass
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${NODE_OAUTH_REDIRECT_BASE:-http://127.0.0.1:8102}
    depends_on:
      node-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8102:3000"
    restart: unless-stopped

  node-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: blackout
      MARIADB_USER: blackout
      MARIADB_PASSWORD: blackout_pass
      MARIADB_ROOT_PASSWORD: root_pass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: django/Dockerfile
    environment:
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-django-lab}
      DB_HOST: django-db
    depends_on:
      django-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8103:8000"
    restart: unless-stopped

  django-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-django-lab}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "community", "-d", "community"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
